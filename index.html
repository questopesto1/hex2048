<style>
  :root {
    --bg: #1a1a2e;
    --bg-gradient: radial-gradient(ellipse at center, #232347 0%, #1a1a2e 70%);
    --panel: #16213e;
    --border: #0f3460;
    --accent: #f7b733;
    --text: #eeeeee;
    --text-secondary: #888888;
    --empty-cell: #1e2942;
    --overlay-bg: rgba(26, 26, 46, 0.94);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  [data-theme="light"] {
    --bg: #faf8ef;
    --bg-gradient: radial-gradient(ellipse at center, #ffffff 0%, #faf8ef 70%);
    --panel: #bbada0;
    --border: #a39489;
    --accent: #8f7a66;
    --text: #776e65;
    --text-secondary: #a39489;
    --empty-cell: #cdc1b4;
    --overlay-bg: rgba(250, 248, 239, 0.95);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  /* ИСПРАВЛЕНИЕ СВАЙПОВ: Блокировка системных жестов */
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;           /* Запрет скролла страницы */
    overscroll-behavior: none;  /* Запрет pull-to-refresh и bounce-эффекта */
    touch-action: none;         /* Полный запрет браузерной обработки тачей */
    position: fixed;            /* Фиксация для iOS Safari / TG WebView */
    top: 0; left: 0; right: 0; bottom: 0;
  }
  
  body {
    background: var(--bg-gradient);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text);
    user-select: none; -webkit-user-select: none;
    padding: calc(10px + var(--safe-top)) 10px calc(10px + var(--safe-bottom));
    transition: background 0.3s ease, color 0.3s ease;
  }

  h1 { 
    font-size: 2.2rem; margin-bottom: 0.4em; 
    background: linear-gradient(135deg, var(--accent), #fc4a1a); 
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
  }

  .header { display: flex; align-items: center; gap: 0.8em; margin-bottom: 1em; flex-wrap: wrap; justify-content: center; }
  
  .score-box { 
    background: var(--panel); border: 2px solid var(--border); border-radius: 10px; 
    padding: 0.3em 0.8em; text-align: center; min-width: 70px; 
    transition: background 0.3s, border-color 0.3s;
  }
  .score-box .label { font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
  .score-box .value { font-size: 1.3rem; font-weight: bold; color: var(--accent); }

  .diff-select { 
    background: var(--panel); color: var(--text); border: 2px solid var(--border); 
    padding: 0.3em 0.6em; border-radius: 8px; font-size: 0.85rem; cursor: pointer; outline: none;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }

  .btn { 
    background: linear-gradient(135deg, var(--accent), #fc4a1a); border: none; color: #fff; 
    font-size: 0.85rem; font-weight: bold; padding: 0.4em 1em; border-radius: 8px; 
    cursor: pointer; transition: transform 0.15s; 
  }
  .btn:active { transform: scale(0.95); }

  .theme-toggle {
    width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--border);
    background: var(--panel); color: var(--accent); font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.3s, border-color 0.3s, transform 0.15s;
  }
  .theme-toggle:active { transform: scale(0.9); }

  #game-container { 
    position: relative; transition: transform 0.3s ease; 
    touch-action: none; /* Дублирование для гарантии */
  }
  #grid-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  #tiles-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  .hex {
    position: absolute; width: 70px; height: 60.62px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; font-weight: 700;
    transition: left 0.18s ease-out, top 0.18s ease-out, background 0.2s;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.4)) drop-shadow(0 5px 5px rgba(0,0,0,0.25));
  }
  .hex::before { content: ''; position: absolute; inset: 0; clip-path: inherit; background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.08) 40%, transparent 55%, rgba(0,0,0,0.2) 100%); pointer-events: none; }
  .hex::after { content: ''; position: absolute; inset: 4px; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 60%); pointer-events: none; }

  .hex.empty { background: var(--empty-cell); color: transparent; filter: none; transition: background 0.3s; z-index: 0; }
  .hex.empty::before, .hex.empty::after { display: none; }
  .hex.tile { z-index: 2; pointer-events: auto; }

  .hex.new-tile { animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .hex.merged-tile { animation: popMerge 0.32s ease-out; }
  .hex.neighbor-merged { animation: neighborMerge 0.4s ease-out; }
  .hex.consumed-neighbor { animation: consumedFade 0.25s ease-out forwards; pointer-events: none; }
  @keyframes popIn { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.15) rotate(5deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes popMerge { 0% { transform: scale(1); } 30% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes neighborMerge { 0% { transform: scale(1); } 30% { transform: scale(1.35) rotate(5deg); filter: drop-shadow(0 0 15px rgba(255,220,100,0.9)); } 60% { transform: scale(0.95); } 100% { transform: scale(1); } }
  @keyframes consumedFade { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.3) rotate(180deg); opacity: 0; } }
