<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hex2048 Gems</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:#0d0d1a;--bg-grad:radial-gradient(ellipse at center,#1a1a3e 0%,#0d0d1a 70%);--panel:#151530;--border:#2a2a5e;--accent:#f7b733;--text:#eee;--text-sec:#888;--empty:#1a1a35;--overlay:rgba(13,13,26,.96)}
  [data-theme="light"]{--bg:#f5f0e8;--bg-grad:radial-gradient(ellipse at center,#fffdf5 0%,#f5f0e8 70%);--panel:#e8e0d0;--border:#c8b898;--accent:#8f7a66;--text:#4a4035;--text-sec:#9a8a70;--empty:#ddd5c5;--overlay:rgba(245,240,232,.96)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;top:0;left:0;right:0;bottom:0;margin:0;padding:0}
  body{background:var(--bg-grad);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;user-select:none;-webkit-user-select:none;padding-top:max(env(safe-area-inset-top),8px);padding-bottom:max(env(safe-area-inset-bottom),8px);padding-left:8px;padding-right:8px;transition:background .3s,color .3s;min-height:100vh;min-height:100dvh;height:100%}
  h1{font-size:1.8rem;margin:.2em 0;background:linear-gradient(135deg,#ff6bcb,#f7b733,#4deeea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0;text-shadow:none}
  .header{display:flex;align-items:center;gap:.4em;margin-bottom:.3em;flex-wrap:wrap;justify-content:center;flex-shrink:0}
  .score-box{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:.2em .6em;text-align:center;min-width:55px;transition:background .3s,border-color .3s}
  .score-box .label{font-size:.5rem;color:var(--text-sec);text-transform:uppercase;letter-spacing:1px}
  .score-box .value{font-size:1.1rem;font-weight:bold;color:var(--accent)}
  .diff-select{background:var(--panel);color:var(--text);border:2px solid var(--border);padding:.2em .4em;border-radius:6px;font-size:.75rem;cursor:pointer;outline:none}
  .btn{background:linear-gradient(135deg,var(--accent),#fc4a1a);border:none;color:#fff;font-size:.75rem;font-weight:bold;padding:.3em .8em;border-radius:6px;cursor:pointer;transition:transform .15s}
  .btn:active{transform:scale(.95)}
  .btn-share{background:linear-gradient(135deg,#6c5ce7,#a29bfe)!important;margin-bottom:.5em}
  .icon-btn{width:32px;height:32px;border-radius:6px;border:2px solid var(--border);background:var(--panel);color:var(--accent);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .3s,background .3s,border-color .3s}
  .icon-btn:active{transform:scale(.9)}.icon-btn.muted{opacity:.5}.icon-btn.active{background:var(--accent);color:#1a1a2e;border-color:var(--accent)}
  #game-wrapper{flex:1;width:100%;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #game-container{position:relative;flex-shrink:0}
  #grid-layer,#tiles-layer{position:absolute;inset:0;pointer-events:none}
  #grid-layer{z-index:0}#tiles-layer{z-index:1}

  /* === БАЗОВАЯ ПЛИТКА-КРИСТАЛЛ === */
  .hex{
    position:absolute;width:70px;height:60.62px;
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
    display:flex;align-items:center;justify-content:center;
    font-size:1.15rem;font-weight:800;
    transition:left .18s ease-out,top .18s ease-out,background .2s;
    text-shadow:0 1px 3px rgba(0,0,0,.5),0 0 8px rgba(255,255,255,.3);
  }
  /* Верхняя грань — блик */
  .hex::before{
    content:'';position:absolute;inset:0;clip-path:inherit;
    background:linear-gradient(170deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,.2) 25%,transparent 50%,rgba(0,0,0,.15) 75%,rgba(0,0,0,.3) 100%);
    pointer-events:none;z-index:1;
  }
  /* Внутренняя грань — глубина */
  .hex::after{
    content:'';position:absolute;
    top:6px;left:8px;right:8px;bottom:6px;
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
    background:linear-gradient(135deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.05) 40%,transparent 60%);
    pointer-events:none;z-index:2;
  }

  /* === ПУСТЫЕ ЯЧЕЙКИ — ОПРАВЫ === */
  .hex.empty{
    background:var(--empty);
    color:transparent;
    filter:none;
    z-index:0;
    border:none;
    box-shadow:inset 0 0 8px rgba(255,255,255,.03);
  }
  .hex.empty::before{
    background:linear-gradient(170deg,rgba(255,255,255,.06) 0%,transparent 40%,rgba(0,0,0,.1) 100%);
  }
  .hex.empty::after{display:none}

  .hex.tile{z-index:2}

  /* === АНИМАЦИИ КРИСТАЛЛОВ === */
  .hex.new-tile{animation:gemAppear .4s cubic-bezier(.175,.885,.32,1.275)}
  .hex.merged-tile{animation:gemMerge .4s ease-out}
  .hex.neighbor-merged{animation:gemNeighborMerge .5s ease-out}
  .hex.consumed-neighbor{animation:gemShatter .3s ease-out forwards}

  @keyframes gemAppear{
    0%{transform:scale(0) rotate(-60deg);opacity:0;filter:brightness(3)}
    50%{transform:scale(1.2) rotate(10deg);filter:brightness(1.8)}
    100%{transform:scale(1) rotate(0);opacity:1;filter:brightness(1)}
  }
  @keyframes gemMerge{
    0%{transform:scale(1);filter:brightness(1)}
    25%{transform:scale(1.35);filter:brightness(2) drop-shadow(0 0 15px rgba(255,255,255,.8))}
    50%{transform:scale(.9);filter:brightness(1.3)}
    100%{transform:scale(1);filter:brightness(1)}
  }
  @keyframes gemNeighborMerge{
    0%{transform:scale(1)}
    20%{transform:scale(1.4) rotate(8deg);filter:brightness(2.5) drop-shadow(0 0 20px rgba(255,220,100,.9))}
    50%{transform:scale(.85) rotate(-3deg)}
    100%{transform:scale(1) rotate(0)}
  }
  @keyframes gemShatter{
    0%{transform:scale(1);opacity:1;filter:brightness(2)}
    50%{transform:scale(1.2) rotate(15deg);opacity:.6;filter:brightness(3)}
    100%{transform:scale(0) rotate(45deg);opacity:0;filter:brightness(5)}
  }

  /* === ЦВЕТА ДРАГОЦЕННЫХ КАМНЕЙ === */
  .hex[data-value="2"]{
    background:linear-gradient(145deg,#e8e0d0,#d4c8b0,#c8b898);
    color:#6a5d45;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .hex[data-value="4"]{
    background:linear-gradient(145deg,#c8e6c9,#a5d6a7,#81c784);
    color:#2e5a2e;
    filter:drop-shadow(0 2px 6px rgba(76,175,80,.3));
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .hex[data-value="8"]{
    background:linear-gradient(145deg,#bbdefb,#64b5f6,#42a5f5);
    color:#fff;
    filter:drop-shadow(0 3px 8px rgba(33,150,243,.4));
  }
  .hex[data-value="16"]{
    background:linear-gradient(145deg,#e1bee7,#ce93d8,#ba68c8);
    color:#fff;
    filter:drop-shadow(0 3px 8px rgba(156,39,176,.4));
  }
  .hex[data-value="32"]{
    background:linear-gradient(145deg,#ffccbc,#ff8a65,#ff7043);
    color:#fff;
    filter:drop-shadow(0 3px 10px rgba(255,87,34,.4));
  }
  .hex[data-value="64"]{
    background:linear-gradient(145deg,#ef9a9a,#ef5350,#e53935);
    color:#fff;
    filter:drop-shadow(0 4px 12px rgba(229,57,53,.5));
  }
  .hex[data-value="128"]{
    background:linear-gradient(145deg,#fff9c4,#fff176,#fdd835);
    color:#5d4e00;font-size:1rem;
    filter:drop-shadow(0 4px 12px rgba(253,216,53,.5));
  }
  .hex[data-value="256"]{
    background:linear-gradient(145deg,#b2dfdb,#4db6ac,#00897b);
    color:#fff;font-size:1rem;
    filter:drop-shadow(0 0 10px rgba(0,137,123,.6));
    animation:gemPulse 2.5s ease-in-out infinite;
  }
  .hex[data-value="512"]{
    background:linear-gradient(145deg,#f8bbd0,#f06292,#ec407a);
    color:#fff;font-size:1rem;
    filter:drop-shadow(0 0 12px rgba(236,64,122,.6));
    animation:gemPulse 2.2s ease-in-out infinite;
  }
  .hex[data-value="1024"]{
    background:linear-gradient(145deg,#d1c4e9,#9575cd,#7e57c2);
    color:#fff;font-size:.9rem;
    filter:drop-shadow(0 0 14px rgba(126,87,194,.7));
    animation:gemPulse 2s ease-in-out infinite;
  }
  .hex[data-value="2048"]{
    background:linear-gradient(145deg,#ffe082,#ffc107,#ff8f00);
    color:#fff;font-size:.9rem;
    filter:drop-shadow(0 0 18px rgba(255,143,0,.8));
    animation:gemRadiance 1.8s ease-in-out infinite;
  }
  .hex[data-value="4096"]{
    background:linear-gradient(145deg,#80deea,#26c6da,#00acc1);
    color:#fff;font-size:.9rem;
    filter:drop-shadow(0 0 20px rgba(0,172,193,.8));
    animation:gemRadiance 1.6s ease-in-out infinite;
  }
  .hex[data-value="8192"]{
    background:linear-gradient(145deg,#ea80fc,#e040fb,#d500f9);
    color:#fff;font-size:.9rem;
    filter:drop-shadow(0 0 22px rgba(213,0,249,.9));
    animation:gemRadiance 1.4s ease-in-out infinite;
  }
  .hex.higher{
    background:linear-gradient(145deg,#ff80ab,#ff4081,#f50057);
    color:#fff;font-size:.8rem;
    filter:drop-shadow(0 0 25px rgba(245,0,87,.9));
    animation:gemRadiance 1.2s ease-in-out infinite;
  }

  @keyframes gemPulse{
    0%,100%{filter:drop-shadow(0 0 8px currentColor) brightness(1)}
    50%{filter:drop-shadow(0 0 18px currentColor) brightness(1.2)}
  }
  @keyframes gemRadiance{
    0%,100%{filter:drop-shadow(0 0 12px currentColor) brightness(1);transform:scale(1)}
    50%{filter:drop-shadow(0 0 25px currentColor) brightness(1.3);transform:scale(1.03)}
  }

  /* Вспышка при крупном слиянии */
  .hex.big-flash::before{animation:gemFlashOverlay .7s ease-out}
  @keyframes gemFlashOverlay{
    0%{background:rgba(255,255,255,1);filter:brightness(3)}
    30%{background:rgba(255,255,255,.6)}
    100%{background:linear-gradient(170deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,.2) 25%,transparent 50%,rgba(0,0,0,.15) 75%,rgba(0,0,0,.3) 100%)}
  }

  /* Радужные осколки */
  .spark{
    position:absolute;width:8px;height:8px;
    border-radius:2px;
    background:linear-gradient(135deg,#ff6bcb,#f7b733,#4deeea,#a29bfe);
    pointer-events:none;z-index:10;
    animation:gemSparkFly .7s ease-out forwards;
  }
  @keyframes gemSparkFly{
    0%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0) rotate(180deg);opacity:0}
  }

  .mobile-controls{display:none;margin-top:.3em;gap:3px;grid-template-columns:repeat(3,var(--btn-size,48px));grid-template-rows:repeat(2,var(--btn-size,48px));justify-content:center;align-items:center;flex-shrink:0}
  .mobile-controls button{width:var(--btn-size,48px);height:var(--btn-size,48px);font-size:1rem;background:var(--panel);border:2px solid var(--border);color:var(--accent);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .mobile-controls button:active{background:var(--border);transform:scale(.92)}
  .mc-up{grid-column:2;grid-row:1}.mc-nw{grid-column:1;grid-row:1}.mc-ne{grid-column:3;grid-row:1}
  .mc-sw{grid-column:1;grid-row:2}.mc-down{grid-column:2;grid-row:2}.mc-se{grid-column:3;grid-row:2}
  .overlay{position:absolute;inset:0;background:var(--overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .35s;padding:1.5em}
  .overlay.active{opacity:1;pointer-events:all}
  .overlay h2{font-size:1.6rem;margin-bottom:.3em;background:linear-gradient(135deg,#ff6bcb,#f7b733,#4deeea);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .overlay p{font-size:.9rem;color:var(--text-sec);margin-bottom:.7em;text-align:center}
  #nickname-form{display:none;align-items:center;gap:.4em;margin-bottom:.8em}
  #nickname-input{padding:.35em .5em;border-radius:6px;border:2px solid var(--border);background:var(--panel);color:var(--text);font-size:.9rem;width:140px;text-align:center;outline:none;touch-action:auto}
  #nickname-input:focus{border-color:var(--accent)}
  .lb-container{width:280px;max-height:220px;overflow-y:auto;background:var(--panel);border-radius:8px;padding:.4em;font-size:.8rem;margin-bottom:.7em;overscroll-behavior:contain}
  .lb-tabs{display:flex;gap:4px;margin-bottom:.4em}
  .lb-tab{flex:1;padding:.3em;border-radius:6px;border:2px solid var(--border);background:transparent;color:var(--text-sec);font-size:.7rem;font-weight:bold;cursor:pointer;text-align:center;transition:all .2s}
  .lb-tab.active{background:var(--accent);color:#1a1a2e;border-color:var(--accent)}
  .lb-header{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:.25em .4em;color:var(--text-sec);margin-bottom:.15em}
  .lb-row{display:flex;justify-content:space-between;padding:.25em .4em;border-radius:4px;color:var(--text)}
  .lb-row:hover{background:rgba(247,183,51,.1)}.lb-row.top1{color:var(--accent);font-weight:bold}
  .lb-row.me{background:rgba(247,183,51,.15);border:1px solid var(--accent)}
  .lb-loading{text-align:center;color:var(--text-sec);padding:.8em}
  .lb-empty{text-align:center;color:var(--text-sec);padding:.8em;font-style:italic}
  @media(hover:none) and (pointer:coarse){.mobile-controls{display:grid}}
  @media(max-width:600px){h1{font-size:1.4rem;margin:.15em 0}.header{gap:.3em;margin-bottom:.2em}.score-box{padding:.15em .4em;min-width:45px}.score-box .value{font-size:1rem}.mobile-controls{--btn-size:40px;gap:2px;margin-top:.2em}}
  @media(max-height:700px){h1{font-size:1.3rem;margin:.1em 0}.header{margin-bottom:.15em}.mobile-controls{--btn-size:36px;gap:2px;margin-top:.1em}}
  @media(max-height:600px){.mobile-controls{--btn-size:32px;gap:1px;margin-top:.05em}.mobile-controls button{font-size:.85rem;border-width:1px}}
</style>
</head>
<body>
<h1>💎 Hex 2048</h1>
<div class="header">
  <div class="score-box"><div class="label">Счёт</div><div class="value" id="score">0</div></div>
  <select class="diff-select" id="radiusSelect">
    <option value="2" selected>19</option><option value="3">37</option><option value="4">61</option><option value="5">91</option><option value="6">127</option>
  </select>
  <button class="btn" id="newGameBtn">Новая</button>
  <button class="icon-btn" id="shareHeaderBtn" aria-label="Поделиться">📤</button>
  <button class="icon-btn" id="trophyBtn" aria-label="Чемпионы">🏆</button>
  <div class="score-box"><div class="label">Рекорд</div><div class="value" id="best">0</div></div>
  <button class="icon-btn active" id="magnetToggle" aria-label="Магнит">🧲</button>
  <button class="icon-btn" id="soundToggle" aria-label="Звук">🔊</button>
  <button class="icon-btn" id="themeToggle" aria-label="Тема">🌙</button>
</div>
<div id="game-wrapper"><div id="game-container"><div id="grid-layer"></div><div id="tiles-layer"></div></div></div>
<div class="mobile-controls">
  <button class="mc-nw" data-dir="5">↖</button><button class="mc-up" data-dir="0">↑</button><button class="mc-ne" data-dir="1">↗</button>
  <button class="mc-sw" data-dir="4">↙</button><button class="mc-down" data-dir="3">↓</button><button class="mc-se" data-dir="2">↘</button>
</div>
<div class="overlay" id="overlay">
  <h2 id="overlayTitle">Игра окончена!</h2>
  <p id="overlayMsg">Попробуйте ещё раз</p>
  <div id="nickname-form"><input type="text" id="nickname-input" placeholder="Ваш ник" maxlength="12"><button class="btn" id="submit-nick" style="padding:.35em .7em;">✓</button></div>
  <div class="lb-container" id="gameOverLb"></div>
  <button class="btn btn-share" id="overlayShareBtn">📤 Поделиться результатом</button>
  <button class="btn" id="overlayBtn">Заново</button>
</div>
<div class="overlay" id="trophyOverlay">
  <h2>🏆 Чемпионы</h2>
  <div class="lb-tabs">
    <button class="lb-tab active" id="tabCurrent">Текущее поле</button>
    <button class="lb-tab" id="tabAll">Все поля</button>
  </div>
  <div class="lb-container" id="trophyLb"></div>
  <button class="btn" id="trophyCloseBtn">Закрыть</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
window.onerror=(msg,url,line,col,err)=>{console.error('GAME ERROR:',msg,'at',line+':'+col,err);document.title='ERR: '+msg};

// === SUPABASE ===
const SUPABASE_URL='https://vjsxfmfjschipjdbmyix.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqc3hmbWZqc2NoaXBqZGJteWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTc4NzksImV4cCI6MjA5NTI3Mzg3OX0.sGLd7bOD-XA5y2c-b0JXsTvmavX4G1YVH96dzecQbCA';
let supabaseClient=null;
function initSupabase(){if(typeof supabase==='undefined'){console.error('[DB] SDK not loaded');return}try{supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);console.log('[DB] ✅ Client created');supabaseClient.from('leaderboard').select('id').limit(1).then(({error})=>{if(error)console.error('[DB] ❌ Test failed:',error.message);else console.log('[DB] ✅ Connection OK')})}catch(e){console.error('[DB] ❌ Init:',e.message)}}
function getTgUser(){try{const u=window.Telegram?.WebApp?.initDataUnsafe?.user;if(!u)return null;return{id:String(u.id),name:u.first_name||(u.username||'Player')}}catch(e){return null}}
function getTgUserId(){const u=getTgUser();return u?u.id:''}
function getDefaultNick(){const u=getTgUser();return u?u.name:'Player'}

let saveTimeout=null;let lastSavedScore=0;
function scheduleAutoSave(){if(saveTimeout)clearTimeout(saveTimeout);saveTimeout=setTimeout(()=>autoSaveDuringGame(),1500)}
async function autoSaveDuringGame(){
  const uid=getTgUserId();if(!supabaseClient||!uid||score<=0||score<=lastSavedScore)return;lastSavedScore=score;
  try{const{data:ex}=await supabaseClient.from('leaderboard').select('id,score').eq('user_id',uid).eq('radius',CURRENT_RADIUS).order('score',{ascending:false}).limit(1);
  if(ex&&ex.length>0&&score>ex[0].score){await supabaseClient.from('leaderboard').update({score,nick:getDefaultNick()}).eq('id',ex[0].id);console.log('[DB] ✅ Live updated',score)}
  else if(!ex||!ex.length){await supabaseClient.from('leaderboard').insert({nick:getDefaultNick(),score,radius:CURRENT_RADIUS,user_id:uid});console.log('[DB] ✅ Live inserted',score)}}catch(e){console.error('[DB] ❌ LiveSave:',e.message)}
}
async function saveGameOverScore(sc,radius){
  const uid=getTgUserId();if(!supabaseClient||!uid||sc<=0)return;const nick=getDefaultNick();
  try{const{data:ex}=await supabaseClient.from('leaderboard').select('id,score').eq('user_id',uid).eq('radius',radius).gte('score',sc).limit(1);
  if(ex&&ex.length>0){await supabaseClient.from('leaderboard').update({score:sc,nick}).eq('id',ex[0].id);console.log('[DB] ✅ GameOver updated',sc)}
  else{await supabaseClient.from('leaderboard').insert({nick,score:sc,radius,user_id:uid});console.log('[DB] ✅ GameOver new',sc)}
  lastSavedScore=sc}catch(e){console.error('[DB] ❌ GameOverSave:',e.message)}
}
async function saveScoreWithNick(nick,sc,radius){
  const uid=getTgUserId();if(!supabaseClient||!uid||!nick)return;
  try{const{data:ex}=await supabaseClient.from('leaderboard').select('id').eq('user_id',uid).eq('radius',radius).order('score',{ascending:false}).limit(1);
  if(ex&&ex.length>0){await supabaseClient.from('leaderboard').update({nick:nick.trim(),score:Math.max(sc,0)}).eq('id',ex[0].id)}
  else{await supabaseClient.from('leaderboard').insert({nick:nick.trim(),score:sc,radius,user_id:uid})}
  console.log('[DB] ✅ Nick saved:',nick)}catch(e){console.error('[DB] ❌ SaveNick:',e.message)}
}
async function saveShareEvent(rt){const uid=getTgUserId();if(!supabaseClient||!uid)return;try{await supabaseClient.from('share_events').insert({sender_id:uid,recipient_type:rt||null,score,radius:CURRENT_RADIUS})}catch(e){}}
async function loadLeaderboard(radius){
  if(!supabaseClient)return null;

const HEX_SIZE=35,HALF_W=35,HALF_H=30.31;let CURRENT_RADIUS=2,GRID=[],cx=0,cy=0;
const DIRECTIONS=[{dq:0,dr:-1},{dq:1,dr:-1},{dq:1,dr:0},{dq:0,dr:1},{dq:-1,dr:1},{dq:-1,dr:0}];
const key=(q,r)=>q+','+r;
const container=document.getElementById('game-container'),gridLayer=document.getElementById('grid-layer'),tilesLayer=document.getElementById('tiles-layer');
const tiles=new Map();let nextTileId=1,isAnimating=false,score=0,best=0,gameOver=false,won=false,submittedNick=false;
const radiusSelect=document.getElementById('radiusSelect');

function hexToPixel(q,r){return{x:HEX_SIZE*1.5*q,y:HEX_SIZE*Math.sqrt(3)*(r+q/2)}}
function inGrid(q,r){return Math.abs(q)<=CURRENT_RADIUS&&Math.abs(r)<=CURRENT_RADIUS&&Math.abs(q+r)<=CURRENT_RADIUS}
function buildGrid(r){CURRENT_RADIUS=r;GRID=[];for(let q=-r;q<=r;q++)for(let r2=-r;r2<=r;r2++)if(Math.abs(q+r2)<=r)GRID.push({q,r:r2});updateContainerSize();renderEmptyGrid();loadBest()}
function updateContainerSize(){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const c of GRID){const p=hexToPixel(c.q,c.r);minX=Math.min(minX,p.x-HALF_W);maxX=Math.max(maxX,p.x+HALF_W);minY=Math.min(minY,p.y-HALF_H);maxY=Math.max(maxY,p.y+HALF_H)}
  const fieldW=Math.ceil(maxX-minX+40),fieldH=Math.ceil(maxY-minY+40);
  container.style.width=fieldW+'px';container.style.height=fieldH+'px';cx=fieldW/2;cy=fieldH/2;
  const wr=wrapper.getBoundingClientRect();const availW=wr.width-4,availH=wr.height-4;
  if(availW<=0||availH<=0)return;
  const scale=Math.max(0.2,Math.min(1.5,Math.min(availW/fieldW,availH/fieldH)));
  container.style.transform='scale('+scale+')';container.style.transformOrigin='center center';
}
function positionEl(el,q,r){const p=hexToPixel(q,r);el.style.left=(cx+p.x-HALF_W)+'px';el.style.top=(cy+p.y-HALF_H)+'px'}

function sessionKey(r){return 'hex2048_session_'+r}
function saveSession(){const td=[];for(const t of tiles.values())td.push({q:t.q,r:t.r,value:t.value});localStorage.setItem(sessionKey(CURRENT_RADIUS),JSON.stringify({score,radius:CURRENT_RADIUS,gameOver,won,submittedNick,tiles:td,nextTileId}))}
function clearLayers(){gridLayer.innerHTML='';tilesLayer.innerHTML='';tiles.clear()}
function loadSessionForRadius(r){
  try{const raw=localStorage.getItem(sessionKey(r));if(!raw)return false;const s=JSON.parse(raw);
  if(!s.tiles||!Array.isArray(s.tiles)||s.tiles.length===0)return false;
  clearLayers();score=s.score||0;gameOver=!!s.gameOver;won=!!s.won;submittedNick=!!s.submittedNick;nextTileId=s.nextTileId||100;lastSavedScore=score;
  document.getElementById('score').textContent=score;buildGrid(r);
  for(const td of s.tiles){const id=nextTileId++;const el=document.createElement('div');el.className='hex tile';el.dataset.value=td.value;el.textContent=td.value;positionEl(el,td.q,td.r);tilesLayer.appendChild(el);tiles.set(id,{id,value:td.value,q:td.q,r:td.r,el})}

function newGame(){clearSessionForRadius(CURRENT_RADIUS);clearLayers();nextTileId=1;score=0;gameOver=false;won=false;submittedNick=false;isAnimating=false;lastSavedScore=0;document.getElementById('score').textContent='0';document.getElementById('overlay').classList.remove('active');document.getElementById('nickname-form').style.display='none';buildGrid(parseInt(radiusSelect.value));for(let i=0;i<Math.max(2,Math.floor(CURRENT_RADIUS*.6));i++)addRandomTile();saveSession();haptic('light')}
function switchRadius(newR){if(tiles.size>0)saveSession();const restored=loadSessionForRadius(newR);if(!restored){clearLayers();nextTileId=1;score=0;gameOver=false;won=false;submittedNick=false;isAnimating=false;lastSavedScore=0;document.getElementById('score').textContent='0';document.getElementById('overlay').classList.remove('active');document.getElementById('nickname-form').style.display='none';buildGrid(newR);for(let i=0;i<Math.max(2,Math.floor(CURRENT_RADIUS*.6));i++)addRandomTile();saveSession()}haptic('light')}
function renderEmptyGrid(){gridLayer.innerHTML='';for(const c of GRID){const el=document.createElement('div');el.className='hex empty';positionEl(el,c.q,c.r);gridLayer.appendChild(el)}}
function emptyCells(){const occ=new Set();for(const t of tiles.values())occ.add(key(t.q,t.r));return GRID.filter(c=>!occ.has(key(c.q,c.r)))}
function addTile(q,r,value){const id=nextTileId++;const el=document.createElement('div');el.className='hex tile new-tile';el.dataset.value=value;el.textContent=value;positionEl(el,q,r);tilesLayer.appendChild(el);const tile={id,value,q,r,el};tiles.set(id,tile);return tile}
function addRandomTile(){const empty=emptyCells();if(!empty.length)return;const cell=empty[Math.floor(Math.random()*empty.length)];addTile(cell.q,cell.r,Math.random()<.9?2:4)}
function getLines(dir){const{dq,dr}=DIRECTIONS[dir],lines={};for(const c of GRID){let lid;if(dir===0||dir===3)lid='q='+c.q;else if(dir===1||dir===4)lid='s='+(c.q+c.r);else lid='r='+c.r;if(!lines[lid])lines[lid]=[];lines[lid].push(c)}for(const k in lines)lines[k].sort((a,b)=>(a.q*dq+a.r*dr)-(b.q*dq+b.r*dr));return Object.values(lines)}
function canStillPlay(){if(emptyCells().length>0)return true;const tl=Array.from(tiles.values());for(const t of tl)for(const d of DIRECTIONS){const nq=t.q+d.dq,nr=t.r+d.dr;if(!inGrid(nq,nr))continue;for(const o of tl)if(o.id!==t.id&&o.q===nq&&o.r===nr&&o.value===t.value)return true}return false}
function finishTurn(){saveSession();if(!canStillPlay()){gameOver=true;SFX.lose();haptic('error');saveBestLocal();saveGameOverScore(score,CURRENT_RADIUS);saveLBLocal(getDefaultNick(),score);saveSession();setTimeout(()=>showOverlay('Игра окончена','Финальный счёт: '+score,false),350)}isAnimating=false}
function move(dir){
  if(gameOver||isAnimating)return;const{dq,dr}=DIRECTIONS[dir],lines=getLines(dir);
  const vBoard=new Map();for(const t of tiles.values())vBoard.set(key(t.q,t.r),t.id);
  const merges=[],mergedInto=new Set();let moved=false;
  for(const line of lines){let lastId=null;for(const cell of line){const k=key(cell.q,cell.r),tid=vBoard.get(k);if(tid===undefined)continue;const tile=tiles.get(tid);let tq=cell.q,tr=cell.r,mergeWith=null;while(true){const nq=tq+dq,nr=tr+dr;if(!inGrid(nq,nr))break;const nk=key(nq,nr);if(!vBoard.has(nk)){tq=nq;tr=nr}else{const bid=vBoard.get(nk),b=tiles.get(bid),bv=mergedInto.has(bid)?merges.find(m=>m.survivorId===bid)?.newValue||b.value:b.value;if(bv===tile.value&&!mergedInto.has(bid)&&bid!==lastId){mergeWith=bid;tq=nq;tr=nr}break}}if(mergeWith!==null){merges.push({survivorId:mergeWith,consumedId:tid,newValue:tile.value*2});mergedInto.add(mergeWith);vBoard.delete(k);tile.q=tq;tile.r=tr;positionEl(tile.el,tq,tr);moved=true;lastId=mergeWith}else{if(tq!==cell.q||tr!==cell.r)moved=true;vBoard.delete(k);vBoard.set(key(tq,tr),tid);tile.q=tq;tile.r=tr;positionEl(tile.el,tq,tr);lastId=tid}}}
  if(!moved&&merges.length===0)return;isAnimating=true;SFX.move();haptic(merges.length>0?'heavy':'light');
  setTimeout(()=>{for(const mg of merges){const s=tiles.get(mg.survivorId),c=tiles.get(mg.consumedId);if(c){c.el.remove();tiles.delete(mg.consumedId)}s.value=mg.newValue;s.el.textContent=mg.newValue;s.el.dataset.value=mg.newValue;s.el.classList.remove('merged-tile','big-flash');void s.el.offsetWidth;s.el.classList.add('merged-tile');SFX.merge(mg.newValue);if(mg.newValue>=256){s.el.classList.add('big-flash');setTimeout(()=>s.el.classList.remove('big-flash'),600);haptic('rigid')}score+=mg.newValue}document.getElementById('score').textContent=score;saveBestLocal();scheduleAutoSave();for(const t of tiles.values())if(t.value>=2048&&!won){won=true;SFX.win();haptic('success');showOverlay('🎉 Победа!','Счёт: '+score+'. Продолжайте!',true);saveSession()}if(magnetEnabled){cascadeNeighborMerges()}else{addRandomTile();finishTurn()}},190);
}
function findNeighborPairs(){const tl=Array.from(tiles.values()),used=new Set(),pairs=[];tl.sort((a,b)=>b.value-a.value);for(const t of tl){if(used.has(t.id))continue;for(const d of DIRECTIONS){const nq=t.q+d.dq,nr=t.r+d.dr;if(!inGrid(nq,nr))continue;const nb=tl.find(o=>o.id!==t.id&&!used.has(o.id)&&o.q===nq&&o.r===nr&&o.value===t.value);if(nb){pairs.push([t,nb]);used.add(t.id);used.add(nb.id);break}}}return pairs}
function spawnSparks(q,r,n=8){const p=hexToPixel(q,r);for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';const a=(i/n)*Math.PI*2+Math.random()*.5,dist=30+Math.random()*25;s.style.left=(cx+p.x)+'px';s.style.top=(cy+p.y)+'px';s.style.setProperty('--dx',Math.cos(a)*dist+'px');s.style.setProperty('--dy',Math.sin(a)*dist+'px');tilesLayer.appendChild(s);setTimeout(()=>s.remove(),700)}}
function performNeighborMerges(pairs){SFX.cascade();haptic('medium');for(const[t1,t2]of pairs){t2.el.classList.add('consumed-neighbor');setTimeout(()=>{t2.el.remove();tiles.delete(t2.id)},300);const nv=t1.value*2;t1.value=nv;t1.el.textContent=nv;t1.el.dataset.value=nv;t1.el.classList.remove('neighbor-merged','big-flash');void t1.el.offsetWidth;t1.el.classList.add('neighbor-merged');if(nv>=256){t1.el.classList.add('big-flash');setTimeout(()=>t1.el.classList.remove('big-flash'),600)}spawnSparks(t1.q,t1.r,10);score+=nv}document.getElementById('score').textContent=score;saveBestLocal();scheduleAutoSave();for(const t of tiles.values())if(t.value>=2048&&!won){won=true;SFX.win();haptic('success');showOverlay('🎉 Победа!','Счёт: '+score+'. Продолжайте!',true);saveSession()}}
function cascadeNeighborMerges(){const pairs=findNeighborPairs();if(pairs.length===0){addRandomTile();finishTurn();return}performNeighborMerges(pairs);setTimeout(cascadeNeighborMerges,300)}

document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;const angle=Math.atan2(dy,dx)*180/Math.PI;let dir;if(angle>=-30&&angle<30)dir=2;else if(angle>=30&&angle<90)dir=3;else if(angle>=90&&angle<150)dir=4;else if(angle>=150||angle<-150)dir=5;else if(angle>=-150&&angle<-90)dir=0;else dir=1;move(dir)},{passive:true});
document.querySelectorAll('.mobile-controls button').forEach(btn=>{btn.addEventListener('touchstart',e=>{e.preventDefault();move(parseInt(btn.dataset.dir))},{passive:false});btn.addEventListener('click',e=>{e.preventDefault();move(parseInt(btn.dataset.dir))})});
radiusSelect.addEventListener('change',e=>{switchRadius(parseInt(e.target.value))});
document.getElementById('newGameBtn').addEventListener('click',newGame);

// === ЗАПУСК ===
initTheme();initSupabase();
let started=false;
for(const r of [2,3,4,5,6]){if(localStorage.getItem(sessionKey(r))){radiusSelect.value=String(r);if(loadSessionForRadius(r)){started=true;break}}}
if(!started){buildGrid(2);newGame()}
window.addEventListener('load',()=>{setTimeout(forceRecalcLayout,100);setTimeout(forceRecalcLayout,500);setTimeout(forceRecalcLayout,1500)});
</script>
</body>
</html>
